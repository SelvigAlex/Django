<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <p class="message">{{ message }}</p>
        <div class="info">
            <p>Автор: {{ author }}</p>
            <p>Год: {{ year }}</p>
        </div>
        <div class="status">
            <p>Статус: <span class="online">🟢 Онлайн</span></p>
            <p>Время: <span id="time"></span></p>
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
